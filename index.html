<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoja de ruta</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Hoja de ruta</h1><button id="admin">Administrador</button></header><main><section id="view"></section><section class="card"><h2>Comentarios</h2><div id="comments"></div><form id="commentForm"><input id="author" placeholder="Tu nombre" required><textarea id="text" placeholder="Comentario..." required></textarea><button>Añadir comentario</button></form></section></main><dialog id="dlg"><form id="form"><h2>Administración</h2><label>Fecha<input id="date" type="date"></label><fieldset><legend>Primera actuación</legend><label>Nombre del lugar<input id="firstName"></label><label>Tipo<select id="firstType"><option></option><option>Pase en parado</option><option>Pase a calles</option><option>Desfile</option></select></label><label>Salida<input id="firstDepartureTime" type="time"></label><label>Lugar de salida<input id="firstDeparturePlace"></label><label>Llegada aproximada<input id="firstArrivalTime" type="time"></label><label>Ubicación<input id="firstLocation"></label><label>Google Maps<input id="firstMaps" type="url"></label><label>Hora actuación<input id="firstPerformanceTime" type="time"></label></fieldset><fieldset><legend>Comida</legend><label><input id="foodEnabled" type="checkbox"> Hay comida</label><div id="foodFields"><label>Hora<input id="foodTime" type="time"></label><label>Lugar<input id="foodLocation"></label><label>Google Maps<input id="foodMaps" type="url"></label></div></fieldset><fieldset><legend>Segunda actuación</legend><label><input id="secondEnabled" type="checkbox"> Hay segunda actuación</label><div id="secondFields"><label>Nombre del lugar<input id="secondName"></label><label>Tipo<select id="secondType"><option></option><option>Pase en parado</option><option>Pase a calles</option><option>Desfile</option></select></label><label>Salida<inp
